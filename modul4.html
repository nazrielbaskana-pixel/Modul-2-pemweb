<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Web Sederhana</title>
    <link rel="stylesheet" href="modul4.css">
</head>
<body>
    <header>
        <h1>Blog Teknologi</h1>
        <nav>
            <a href="#artikel">Artikel</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <main>
        <article id="artikel">
            <h2>Mengenal Pemrograman Web</h2>
            <p>HTML, CSS, dan JavaScript adalah tiga fondasi utama dalam pemrograman web modern.</p>
        </article>

        <section id="kontak">
            <h2>Hubungi Kami</h2>
            <form id="formKontak">
                <input type="text" id="nama" placeholder="Nama">
                <span class="error" id="errNama"></span>

                <input type="email" id="email" placeholder="Email">
                <span class="error" id="errEmail"></span>

                <textarea id="pesan" rows="4" placeholder="Pesan"></textarea>
                <span class="error" id="errPesan"></span>

                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>

    <footer>
        <p>607022500026 - Nazriel Rizki Dwi Baskana © 2026</p>
    </footer>

    <script src="modul4.js"></script>
</body>
</html>
